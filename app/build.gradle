import com.onemillionworlds.DeepTokenifyDirectory
import com.onemillionworlds.DeepTokenifyFile

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.github.packages) // Plugin for anonymous inclusion of artifacts hosted in github package registry
}

android {
    compileSdk = 35

    defaultConfig {
        applicationId = "com.onemillionworlds.TamarinTestBedAndroid"
        minSdk = 28
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = true
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ["com/simsilica/lemur/style/base/glass-styles.groovy"]
        }
    }
    namespace = 'com.onemillionworlds.android'
}

configurations.all {
    exclude group: 'org.jmonkeyengine', module: 'jme3-desktop'
}


dependencies {

    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    implementation libs.bundles.jme3
    implementation(libs.deeptokens) {
        exclude group: 'org.jmonkeyengine', module: 'jme3-core'
        exclude group: 'org.jmonkeyengine', module: 'jme3-lwjgl3'  // removes LWJGL transitives
        exclude group: 'org.lwjgl'                                  // belt-and-braces on LWJGL
    }

    implementation libs.tamarin.android


    implementation libs.lemur
    implementation libs.lemur.proto

    implementation libs.guava // <-- I don't understand why this is necessary as lemur brings it in, but the Selector dropdown won't work with out this
    implementation libs.minie

    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.espresso.core

}


tasks.register("generateButtonPanel", DeepTokenifyFile){
    inputFile = rootProject.file('deepTokenTemplates/buttonPanel.png')
    outputFile = file('src/main/generated/resources/Models/buttonPanel.j3o')
    tokenWidth = 2f
    tokenDepth = 0.05f
}

tasks.register("generateButtons", DeepTokenifyDirectory){
    inputDirectory = rootProject.file('deepTokenTemplates/buttons')
    outputDirectory = file('src/main/generated/resources/Models/buttons')
    tokenWidth = 0.25f
    tokenDepth = 0.1f
}

// Include the generated Java resources directory in the Android source set
android {
    sourceSets {
        main {
            resources.srcDirs += ['src/main/generated/resources']
        }
    }
}

// On Android, there is no processResources task. Hook generation to run before the build.
tasks.named("preBuild") {
    dependsOn("generateButtons", "generateButtonPanel")
}
