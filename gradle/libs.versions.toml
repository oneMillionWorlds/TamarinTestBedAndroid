[versions]
agp = "9.4.1"
githubPackages = "1.2.1"
jmonkeyengine = "3.9.0-stable"
deeptokens = "1.3.0"
tamarin = "3.1.0"
lemur = "1.16.0"
lemurProto = "1.13.0"
guava = "33.5.0-android"
minie = "9.0.1"
appcompat = "1.4.0"
material = "1.4.0"
constraintlayout = "2.0.4"
navigation = "2.3.5"
junit = "4.+"
androidxJunit = "1.1.3"
espresso = "3.4.0"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment", version.ref = "navigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui", version.ref = "navigation" }

jme3-android = { module = "org.jmonkeyengine:jme3-android", version.ref = "jmonkeyengine" }
jme3-android-native = { module = "org.jmonkeyengine:jme3-android-native", version.ref = "jmonkeyengine" }
jme3-core = { module = "org.jmonkeyengine:jme3-core", version.ref = "jmonkeyengine" }
jme3-effects = { module = "org.jmonkeyengine:jme3-effects", version.ref = "jmonkeyengine" }
jme3-plugins = { module = "org.jmonkeyengine:jme3-plugins", version.ref = "jmonkeyengine" }
jme3-testdata = { module = "org.jmonkeyengine:jme3-testdata", version.ref = "jmonkeyengine" }
jme3-desktop = { module = "org.jmonkeyengine:jme3-desktop", version.ref = "jmonkeyengine" }

deeptokens = { module = "com.onemillionworlds:deeptokens", version.ref = "deeptokens" }
tamarin-android = { module = "com.onemillionworlds:tamarin-android", version.ref = "tamarin" }
lemur = { module = "com.simsilica:lemur", version.ref = "lemur" }
lemur-proto = { module = "com.simsilica:lemur-proto", version.ref = "lemurProto" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
minie = { module = "com.github.stephengold:Minie", version.ref = "minie" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[bundles]
jme3 = ["jme3-android", "jme3-android-native", "jme3-core", "jme3-effects", "jme3-plugins", "jme3-testdata"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
github-packages = { id = "io.github.0ffz.github-packages", version.ref = "githubPackages" }
